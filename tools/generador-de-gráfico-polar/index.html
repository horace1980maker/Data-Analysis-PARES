<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Gráfico Polar de Capacidad Adaptativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
      :root {
        --bg-color: #f4f7f9;
        --card-bg-color: #ffffff;
        --text-color: #333;
        --primary-color: #007bff;
        --secondary-color: #6c757d;
        --border-color: #e0e0e0;
        --shadow-color: rgba(0, 0, 0, 0.05);
        --action-color: rgba(40, 167, 69, 0.7);
        --basic-needs-color: rgba(253, 126, 20, 0.7);
        --innovation-color: rgba(23, 162, 184, 0.7);
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      #root {
        width: 100%;
        max-width: 900px;
      }
      .container {
        background-color: var(--card-bg-color);
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 4px 12px var(--shadow-color);
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 1rem;
        color: #666;
        margin-bottom: 1.5rem;
      }
      .info-inputs {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 2rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .input-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        max-width: 250px;
        text-align: left;
      }
      .input-group label {
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      .input-group input {
        width: 100%;
        padding: 0.65rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .input-group input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
      }
      .file-uploader {
        margin-bottom: 2rem;
      }
      .file-input {
        display: none;
      }
      .file-label {
        background-color: var(--primary-color);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.3s ease;
      }
      .file-label:hover {
        background-color: #0056b3;
      }
      .custom-legend {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-top: 1.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
      }
      .legend-color-box {
        width: 20px;
        height: 12px;
        border-radius: 3px;
      }
      .chart-container {
        position: relative;
        width: 100%;
        height: 600px;
      }
      .error-message {
        color: #dc3545;
        margin-top: 1rem;
        min-height: 1.2em; /* Reserve space to prevent layout shift */
      }
      .download-container {
        margin-top: 2rem;
      }
      .download-btn {
        background-color: var(--secondary-color);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        border: none;
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        transition: background-color 0.3s ease;
      }
      .download-btn:hover {
        background-color: #5a6268;
      }

      /* Mobile Optimizations */
      @media (max-width: 768px) {
        body {
          padding: 1rem;
        }
        .container {
          padding: 1.5rem;
        }
        h1 {
          font-size: 1.5rem;
        }
        p {
          font-size: 0.9rem;
          margin-bottom: 1.5rem;
        }
        .info-inputs {
          flex-direction: column;
          gap: 1rem;
          align-items: center;
        }
        .input-group {
            width: 100%;
            max-width: none;
        }
        .chart-container {
          height: 450px;
        }
        .custom-legend {
          gap: 1rem;
        }
        .legend-item {
          font-size: 0.8rem;
        }
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
        <div class="container">
            <h1>Generador de Gráfico Polar</h1>
            <p>Suba un archivo CSV para visualizar los datos de capacidad adaptativa.</p>
            
            <div class="info-inputs">
              <div class="input-group">
                <label for="org-name">Nombre de la Organización</label>
                <input type="text" id="org-name" placeholder="Ej: Mi Organización">
              </div>
              <div class="input-group">
                <label for="data-date">Fecha de Levantamiento</label>
                <input type="date" id="data-date">
              </div>
            </div>

            <div class="file-uploader">
              <label for="file-input" class="file-label">
                Seleccionar Archivo CSV
              </label>
              <input 
                id="file-input" 
                type="file" 
                accept=".csv" 
                class="file-input"
                aria-label="Cargador de archivos CSV"
              />
            </div>
            <p id="error-message" class="error-message"></p>
            <div class="chart-container">
              <canvas id="polar-chart" aria-label="Gráfico polar de capacidad adaptativa" role="img"></canvas>
            </div>
            <div id="custom-legend" class="custom-legend"></div>
            <div class="download-container">
              <button id="download-btn" class="download-btn">Descargar PNG</button>
            </div>
          </div>
    </div>
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
